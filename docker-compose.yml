x-common: &default-config
  container_name: piai-engine
  restart: unless-stopped
  cpuset: "0-3"
  stop_grace_period: 30s
  cap_add:
    - IPC_LOCK
  ulimits:
    memlock:
      soft: -1
      hard: -1
  ports:
    - "8080:8080"
  environment:
    - LLAMA_ARG_HOST=0.0.0.0
    - LLAMA_ARG_PORT=8080
    - LLAMA_ARG_MODELS_DIR=/models
    - LLAMA_ARG_MODELS_PRESET=/configs/models_preset.ini
    - LLAMA_ARG_MODELS_MAX=2
    - LLAMA_ARG_MODELS_AUTOLOAD=1
    - LLAMA_ARG_UI_CONFIG_FILE=/configs/webui_config.json
    - SLOT_SAVE_INTERVAL=${SLOT_SAVE_INTERVAL:-600}

services:
  # Raspberry Pi 4 Profile (Multi-Model Router)
  piai-pi4:
    <<: *default-config
    build:
      context: .
      dockerfile: docker/Dockerfile.pi4
    volumes:
      - ./models:/models
      - ./configs/webui_config.json:/configs/webui_config.json:ro
      - ./configs/models_preset_pi4.ini:/configs/models_preset.ini:ro
      - ./configs/templates:/configs/templates:ro
      - ./slot_cache:/slots
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
    profiles:
      - pi4

  # Raspberry Pi 5 Profile (Multi-Model Router Production)
  piai-pi5:
    <<: *default-config
    build:
      context: .
      dockerfile: docker/Dockerfile.pi5
    volumes:
      - ./models:/models
      - ./configs/webui_config.json:/configs/webui_config.json:ro
      - ./configs/models_preset_pi5.ini:/configs/models_preset.ini:ro
      - ./configs/templates:/configs/templates:ro
      - ./slot_cache:/slots
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
    profiles:
      - pi5
