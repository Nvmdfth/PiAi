version = 1

; Raspberry Pi 4 profile: 1.5B general + 1.5B coder only, both drafted by the
; 0.5B general model (shared Qwen2.5 vocabulary). No other models on pi4.
[*]
threads = 3
threads-batch = 4
ubatch-size = 512
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
load-mode = mmap+mlock

; 1. Coding Assistant (Speculatively drafted by 0.5B General)
[qwen2.5-coder-1.5b-q4_0]
model = /models/qwen2.5-coder-1.5b-q4_0.gguf
spec-draft-model = /models/qwen2.5-0.5b-q4_0.gguf
spec-draft-n-max = 8
spec-draft-n-min = 1
temp = 0.2
top-p = 0.95
min-p = 0.05
repeat-penalty = 1.05
ctx-size = 4096

; 2. General Assistant (Speculatively drafted by 0.5B General)
[qwen2.5-1.5b-q4_0]
model = /models/qwen2.5-1.5b-q4_0.gguf
spec-draft-model = /models/qwen2.5-0.5b-q4_0.gguf
spec-draft-n-max = 8
spec-draft-n-min = 1
temp = 0.6
top-p = 0.90
min-p = 0.05
repeat-penalty = 1.10
ctx-size = 4096
