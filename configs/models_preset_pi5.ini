version = 1

; Global hardware defaults shared across all models on Raspberry Pi
[*]
threads = 3
threads-batch = 4
ubatch-size = 512
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
load-mode = mmap+mlock

; 1. Fast Coding Assistant (Deterministic cmdlets, pipelines, scripts)
[qwen2.5-coder-0.5b-q4_0]
model = /models/qwen2.5-coder-0.5b-q4_0.gguf
temp = 0.1
top-p = 0.95
min-p = 0.05
repeat-penalty = 1.05
ctx-size = 4096
load-on-startup = true

; 2. Advanced Coding Assistant (Speculatively drafted by 0.5B Coder)
[qwen2.5-coder-1.5b-q4_0]
model = /models/qwen2.5-coder-1.5b-q4_0.gguf
spec-draft-model = /models/qwen2.5-coder-0.5b-q4_0.gguf
spec-draft-n-max = 8
spec-draft-n-min = 1
temp = 0.2
top-p = 0.95
min-p = 0.05
repeat-penalty = 1.05
ctx-size = 4096

; 3. Compact General Assistant (Fast Q&A & classification)
[qwen2.5-0.5b-q4_0]
model = /models/qwen2.5-0.5b-q4_0.gguf
temp = 0.5
top-p = 0.90
min-p = 0.05
repeat-penalty = 1.10
ctx-size = 4096

; 4. General Assistant (Speculatively drafted by 0.5B General)
[qwen2.5-1.5b-q4_0]
model = /models/qwen2.5-1.5b-q4_0.gguf
spec-draft-model = /models/qwen2.5-0.5b-q4_0.gguf
spec-draft-n-max = 8
spec-draft-n-min = 1
temp = 0.6
top-p = 0.90
min-p = 0.05
repeat-penalty = 1.10
ctx-size = 4096

; 5. Micro Router & Tool Dispatcher (Greedy deterministic decoding)
[smollm2-135m-q4_0]
model = /models/smollm2-135m-q4_0.gguf
temp = 0.0
top-p = 1.00
min-p = 0.00
repeat-penalty = 1.00
ctx-size = 2048

; 6. Gemma 4 E2B Standalone Thinking Model
[gemma-4-e2b-it-q4_k_m]
